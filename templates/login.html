<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台登录</title>
<style>
body{background:#f7fafb;padding:14px;font-family:system-ui}
.box{max-width:420px;margin:30px auto;background:#fff;padding:20px;border-radius:16px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;font-size:16px}
button{width:100%;padding:13px;background:#007AFF;color:#fff;border:none;border-radius:10px;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h3>用车账单后台管理</h3>
{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
<form method="post" action="/admin">
<input type="password" name="pwd" placeholder="输入后台密码">
<button type="submit">登录</button>
</form>
</div>
</body>
</html>
