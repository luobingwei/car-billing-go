<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>用车账单生成器</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  padding: 12px;
  background: #F7FAFB;
  font-size: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  color: #111827;
}
.container {
  max-width: 480px;
  margin: 0 auto;
}
h1 {
  font-size: 24px;
  font-weight: 600;
  text-align: center;
  margin: 12px 0 16px;
}
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  padding: 14px 10px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  background: #E9EEF2;
  color: #444;
  cursor: pointer;
}
.tab-btn.active {
  background: #007AFF;
  color: #fff;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.btn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  margin: 8px 0;
  background: #007AFF;
  color: #fff;
}
.copy-btn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  margin: 8px 0;
  background: #34C759;
  color: #fff;
}
.btn-green {
  width: 100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:500;
  margin:8px 0;
  background:#28c76f;
  color:#fff;
}
label {
  font-weight: 600;
  margin-top: 10px;
  margin-bottom: 6px;
  display:block;
}
input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  font-size: 16px;
  background: #fff;
  margin-bottom: 10px;
}
.bill {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.6;
}
.hide {display:none;}
.history-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
  margin-bottom: 10px;
}
.pill-btn {
  padding: 6px 10px;
  background: #f1f5f9;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  color: #333;
  cursor: pointer;
}

/*弹窗*/
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:999;
  display:none;
  padding:16px;
}
.modal-wrap{
  background:#fff;
  border-radius:16px;
  max-width:480px;
  margin:0 auto;
  max-height:85vh;
  overflow-y:auto;
  padding:18px;
}
.modal-text{
  white-space:pre-wrap;
  background:#f7f9fa;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  line-height:1.6;
  margin:10px 0;
}
/* 轻提示 */
#toast{
  position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
  background:rgba(17,24,39,0.92);color:#fff;padding:10px 18px;border-radius:10px;
  font-size:14px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div class="container">
  <h1>用车账单生成器</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('transfer')">接送机</button>
    <button class="tab-btn" onclick="switchTab('package')">包车</button>
    <button class="tab-btn" onclick="switchTab('point')">点对点</button>
  </div>
  <div class="card">
    <label>选择合作公司</label>
    <select id="firmSelect">
      <option value="">请选择公司</option>
      <!--__FIRM_OPTIONS__-->
    </select>

    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn-green" onclick="generateQuote('zh')" style="flex:2;">📄 中文版报价</button>
      <button class="btn-green" onclick="generateQuote('en')" style="flex:1;font-size:13px;">📄 English</button>
    </div>

    <label>@对接人</label>
    <input id="contact" placeholder="输入名字，自动带 @">
    <div class="history-pills" id="hist_contact"></div>
    <label>客户</label>
    <input id="customer">
    <div class="history-pills" id="hist_customer"></div>
    <label>日期</label>
    <input id="time" type="date">

    <div id="transfer_panel" class="tab-panel">
      <label>接送类型</label>
      <select id="transferKind">
        <option value="airport">机场接送</option>
        <option value="station">高铁站接送</option>
      </select>
      <label>航班</label>
      <input id="flight">
      <div class="history-pills" id="hist_flight"></div>
      <label>举牌服务</label>
      <select id="sign">
        <option value="0">不需要</option>
        <option value="1">需要</option>
      </select>
      <label>深夜时段(23:00‑05:00)</label>
      <select id="night">
        <option value="0">否</option>
        <option value="1">是</option>
      </select>
    </div>

    <div id="package_panel" class="tab-panel hide">
      <label>开始时间</label>
      <input id="startHour" type="time">
      <label>结束时间</label>
      <input id="endHour" type="time">
      <label>行驶里程(km)</label>
      <input id="km" value="50">
      <label>套餐选择</label>
      <select id="packageType">
        <option value="4">4小时/50公里</option>
        <option value="8">8小时/100公里</option>
      </select>
    </div>

    <div id="point_panel" class="tab-panel hide">
      <label>行驶里程(km)</label>
      <input id="point_km" value="0">
    </div>

    <label>车型</label>
    <select id="car">
      <option value="normal">舒适车型 | Comfort</option>
      <option value="van">六座豪华商务车 | Business</option>
    </select>
    <label>行程路线</label>
    <input id="route" placeholder="输入地址用空格分隔，自动转箭头">
    <div class="history-pills" id="hist_route"></div>
    <label>路桥停车费（实报实销）</label>
    <input id="park" value="0">
    <div style="display:flex;gap:8px;">
      <div style="flex:2;">
        <label>其他费用明目（选填）</label>
        <input id="extra_name" placeholder="如：咖啡">
      </div>
      <div style="flex:1;">
        <label>金额（选填）</label>
        <input id="extraAmount" type="number" step="0.01" min="0" value="0">
      </div>
    </div>
    <div class="history-pills" id="hist_extra_name"></div>
    <label>实收金额（选填，留空=费用合计）</label>
    <input id="receivedAmount" type="number" step="0.01" min="0" placeholder="留空则等于费用合计">
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn" onclick="generate('zh')" style="flex:2;">生成中文版账单</button>
      <button class="btn" onclick="generate('en')" style="flex:1;font-size:13px;">English</button>
    </div>
  </div>
  <div class="card">
    <h3>账单文本（可复制）</h3>
    <div id="bill_output" class="bill"></div>
    <input type="hidden" id="billAmount">
    <button class="copy-btn" onclick="copyBill()" id="copyBtn" style="display:none;">✅ 一键复制账单</button>
    <button class="copy-btn" onclick="saveOrder()" id="saveBtn" style="display:none;background:#FF9500;">📌 保存到记账本</button>
  </div>
  <div style="text-align:center;margin-top:10px">
     <a href="/admin">进入后台管理</a>
  </div>
</div>

<!--报价弹窗-->
<div class="modal-mask" id="quoteModal">
    <div class="modal-wrap">
        <h3>对外报价模板</h3>
        <div class="modal-text" id="quoteText"></div>
        <button class="copy-btn" onclick="copyQuote()">复制报价文本</button>
        <button class="btn" onclick="closeQuoteModal()">关闭</button>
    </div>
</div>

<div id="toast"></div>

<script>
const firmData = __FIRMS_JSON__;
let currentType = 'transfer';

function switchTab(type) {
  currentType = type;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.remove('active');
    if ((type === 'transfer' && i === 0) ||
        (type === 'package' && i === 1) ||
        (type === 'point' && i === 2)) btn.classList.add('active');
  });
  document.getElementById('transfer_panel').classList.toggle('hide', type !== 'transfer');
  document.getElementById('package_panel').classList.toggle('hide', type !== 'package');
  document.getElementById('point_panel').classList.toggle('hide', type !== 'point');
}
/* ===== 历史记录（存服务器数据库 SQLite，每类最多 10 条；换设备/清缓存不丢） ===== */
function saveHistory(key, value) {
  if (!value) return;
  fetch('/api/history/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: key, value: value })
  }).then(r => r.json()).then(d => { if (d.ok) renderAllHistory(); }).catch(() => {});
}
function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderHistory(key, targetId, list) {
  let el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = (list || []).map(v =>
    `<button class="pill-btn" data-h="${key}" data-v="${escHtml(v)}">${escHtml(v)}</button>`
  ).join('');
}
function renderAllHistory() {
  fetch('/api/history/list').then(r => r.json()).then(d => {
    if (!d.ok) return;
    const h = d.history || {};
    renderHistory('contact', 'hist_contact', h.contact);
    renderHistory('customer', 'hist_customer', h.customer);
    renderHistory('flight', 'hist_flight', h.flight);
    renderHistory('route', 'hist_route', h.route);
    renderHistory('extra_name', 'hist_extra_name', h.extra_name);
  }).catch(() => {});
}
/* 历史记录按钮点击 → 填入对应输入框（事件委托，避免引号注入） */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.pill-btn');
  if (!btn) return;
  const el = document.getElementById(btn.getAttribute('data-h'));
  if (el) el.value = btn.getAttribute('data-v');
});
function calcHour(start,end){
  if(!start||!end)return 0;
  let s=new Date(`2026-01-01 ${start}`);
  let e=new Date(`2026-01-01 ${end}`);
  let diff=(e-s)/1000/60/60;
  return diff<0?diff+24:diff;
}

// ==========生成当前tab对应的报价，价格读取选中公司后台配置==========

        alert("请先选择合作公司");
        return;
    }
    const r = firmData[idx];
    let out = "";
    const sep = "——————————————";

    if(currentType === "transfer"){
        if(lang === "zh"){
            out = `【接送机报价】
服务范围：佛山禅城/桂城
往返：广州白云机场 / 广州南站
（双向接送，接/送均可）

车型报价：
  · 舒适专车
    白云机场 ¥${r.transfer.normal_airport}
    广州南站 ¥${r.transfer.normal_station}
  · 六座豪华商务车
    白云机场 ¥${r.transfer.van_airport}

        }else{
            out = `【Airport Transfer Quotation】
Service Area: Chancheng/Guicheng (Foshan)
↔ Baiyun Airport / Guangzhou South Station
(pick-up or drop-off)

Vehicles:
  · Executive
    Baiyun Airport ¥${r.transfer.normal_airport}

  · 7-Seat Executive MPV
    Baiyun Airport ¥${r.transfer.van_airport}

Add-on Services:

${sep}
Notes: One-way flat rate; parking at actual cost`;
        }
    }else if(currentType === "package"){
        if(lang === "zh"){

    ¥${r.package.van_4h}（4 小时 / 50 公里）
    ¥${r.package.van_8h}（8 小时 / 100 公里）
    超时 ¥${r.package.van_over_h}/小时 · 超里程 ¥${r.package.van_over_km}/公里
${sep}
备注：套餐含固定时长里程，超时、超里程另计
路桥停车实报`;
        }else{
            out = `【Hourly Charter Quotation】
  · Executive
    ¥${r.package.normal_4h} (4 Hours / 50 km)
    ¥${r.package.normal_8h} (8 Hours / 100 km)
    Overtime ¥${r.package.normal_over_h}/h · Extra Mileage ¥${r.package.normal_over_km}/km
  · 7-Seat Executive MPV
    ¥${r.package.van_4h} (4 Hours / 50 km)
    ¥${r.package.van_8h} (8 Hours / 100 km)
    Overtime ¥${r.package.van_over_h}/h · Extra Mileage ¥${r.package.van_over_km}/km
${sep}
Notes: Package includes fixed hours/km.
Overtime & extra mileage charged additionally.

        }
    }else if(currentType === "point"){
        if(lang === "zh"){

function closeQuoteModal(){
    document.getElementById("quoteModal").style.display="none";
}
async function copyQuote(){
    const txt = document.getElementById("quoteText").innerText;
    if(copyText(txt)){ toast("报价已复制"); }
    else{ alert("复制失败，请手动长按复制文本"); }
}

// ==========单次账单生成（lang: zh/en）==========
function generate(lang){
  const firmIdx = document.getElementById("firmSelect").value;
  if(firmIdx===""){
    alert("请先选择合作公司");
    return;
  }
  const rate = firmData[firmIdx];
  const isEn = lang === 'en';

  let val=id=>document.getElementById(id).value.trim();
  let num=id=>Number(document.getElementById(id).value)||0;
  let contact = val('contact');
  let customer = val('customer');
  let date = val('time');
  let car = val('car');
  let flight = val('flight');
  let route = val('route').replace(/\s+/g, ' → ');
  let park = num('park');
  let extraName = val('extra_name');
  let extraAmount = num('extraAmount');
  saveHistory('contact', contact);
  saveHistory('customer', customer);
  saveHistory('flight', flight);
  saveHistory('route', val('route'));
  saveHistory('extra_name', extraName);

  let transferKind = val("transferKind");
  let startT = val('startHour');
  let endT = val('endHour');
  let km = num('km');
  let pkg = val('packageType');
  let totalHour = calcHour(startT,endT);
  let pointKm = num('point_km');
  let signSel = num('sign');
  let nightSel = num('night');

  let carName = car === 'normal'
    ? (isEn ? 'Executive' : '舒适专车')
    : (isEn ? '7-Seat Executive MPV' : '六座豪华商务车');
  let fmtDate = '';
  if(date){
    const [y,m,d] = date.split('-');
    fmtDate = isEn ? `${y}-${m}-${d}` : `${y}年${m}月${d}日`;
  }
  const yuan = isEn ? '' : '元';
  let lastTotal = 0;
  let lines=[];
  if(contact){
    const cleanContact = String(contact).replace(/^@+/, '');
    lines.push(`@${cleanContact}`);
  }
  lines.push(`${isEn?'Customer':'客户'}：${customer}`);

  if(currentType === 'transfer'){
    const tr = rate.transfer;
    let base;
    if(car==='normal'){
      base = transferKind==="airport" ? tr.normal_airport : tr.normal_station;
    }else{
      base = transferKind==="airport" ? tr.van_airport : tr.van_station;
    }
    let signFee = signSel ? tr.sign_fee : 0;
    let nightFee = nightSel ? tr.night_fee : 0;

    lines.push(`${isEn?'Date':'日期'}：${fmtDate}`);
    if(flight) lines.push(`${isEn?'Flight No.':'航班'}：${flight}`);
    lines.push(`${isEn?'Type':'类型'}：${isEn?'Airport Transfer':'接送机'}`);
    lines.push(`${isEn?'Vehicle':'车型'}：${carName}`);
    lines.push(`${isEn?'Route':'路线'}：${route}`);
    lines.push(`${isEn?'Fare Breakdown':'费用明细'}：`);
    lines.push(`  · ${isEn?'Base Fare':'基础车费'}：¥${base}${yuan}`);
    if(signFee>0) lines.push(`  · ${isEn?'Meet & Greet':'举牌服务'}：¥${signFee}${yuan}`);
    if(nightFee>0) lines.push(`  · ${isEn?'Late-night Surcharge':'深夜服务费'}：¥${nightFee}${yuan}`);
    let total = base + signFee + nightFee + park + (extraName ? extraAmount : 0);
    lastTotal = total;
    lines.push(`  · ${isEn?'Tolls & Parking':'路桥停车'}：¥${park}${yuan}`);
    if(extraName) lines.push(`  · ${extraName}：¥${extraAmount}${yuan}`);
    lines.push(`——————————————`);
    lines.push(`${isEn?'Trip Total':'本单小计'}：¥${total}${yuan}`);
  }
  else if(currentType === 'package'){
    const pk = rate.package;
    let baseHour = Number(pkg);
    let baseKm = baseHour === 4 ? 50 : 100;
    let basePrice, hourPrice, kmPrice;
    if (car === 'normal') {
      basePrice = baseHour ===4 ? pk.normal_4h : pk.normal_8h;
      hourPrice = pk.normal_over_h;
      kmPrice = pk.normal_over_km;
    } else {
      basePrice = baseHour ===4 ? pk.van_4h : pk.van_8h;
      hourPrice = pk.van_over_h;
      kmPrice = pk.van_over_km;
    }
    let overHour = Math.ceil(Math.max(0, totalHour - baseHour));
    let overKm = Math.max(0, km - baseKm);
    let overHourPrice = overHour * hourPrice;
    let overKmPrice = overKm * kmPrice;
    let sum = Math.round((basePrice + overHourPrice + overKmPrice + park + (extraName ? extraAmount : 0)) * 100) / 100;
    lastTotal = sum;
    lines.push(`${isEn?'Date':'日期'}：${fmtDate}`);
    lines.push(`${isEn?'Vehicle':'车型'}：${carName}`);
    lines.push(`${isEn?'Package':'套餐'}：${baseHour} h / ${baseKm} km`);
    lines.push(`${isEn?'Service Hours':'用车时间'}：${startT} - ${endT}（${totalHour.toFixed(1)} h）`);
    lines.push(`${isEn?'Distance':'行驶里程'}：${km} km`);
    lines.push(`${isEn?'Route':'行程路线'}：${route}`);
    lines.push(`${isEn?'Fare Breakdown':'费用明细'}：`);
    lines.push(`  · ${isEn?'Package Fare':'套餐基础费'}：¥${basePrice}${yuan}`);
    lines.push(`  · ${isEn?'Overtime':'超时费'}：${overHour} h × ¥${hourPrice}/h = ¥${overHourPrice}${yuan}`);
    lines.push(`  · ${isEn?'Extra Mileage':'超里程费'}：${overKm} km × ¥${kmPrice}/km = ¥${overKmPrice}${yuan}`);
    lines.push(`  · ${isEn?'Tolls & Parking':'路桥停车'}：¥${park}${yuan}`);
    if(extraName) lines.push(`  · ${extraName}：¥${extraAmount}${yuan}`);
    lines.push(`——————————————`);
    lines.push(`${isEn?'Trip Total':'本单小计'}：¥${sum}${yuan}`);
  }
  else {
    const pt = rate.point;
    let rateKm, minFee;
    if (car === 'normal') {
      rateKm = pt.normal_rate;
      minFee = pt.normal_min;
    } else {
      rateKm = pt.van_rate;
      minFee = pt.van_min;
    }
    let calcFee = pointKm * rateKm;
    let baseFee = Math.max(calcFee, minFee);
    lines.push(`${isEn?'Date':'日期'}：${fmtDate}`);
    lines.push(`${isEn?'Type':'类型'}：${isEn?'Point-to-Point':'点对点'}`);
    lines.push(`${isEn?'Vehicle':'车型'}：${carName}`);
    lines.push(`${isEn?'Route':'路线'}：${route}`);
    lines.push(`${isEn?'Fare Breakdown':'费用明细'}：`);
    lines.push(`  · ${isEn?'Distance':'里程'}：${pointKm} km × ¥${rateKm}/km = ¥${calcFee.toFixed(1)}${yuan}`);
    lines.push(`  · ${isEn?'Minimum Fare':'最低消费'}：¥${minFee}${yuan}`);
    lines.push(`  · ${isEn?'Base Fare':'基础车费'}：¥${Math.round(baseFee)}${yuan}`);
    let total = Math.round(baseFee) + park + (extraName ? extraAmount : 0);
    lastTotal = total;
    lines.push(`  · ${isEn?'Tolls & Parking':'路桥停车'}：¥${park}${yuan}`);
    if(extraName) lines.push(`  · ${extraName}：¥${extraAmount}${yuan}`);
    lines.push(`——————————————`);
    lines.push(`${isEn?'Total':'费用合计'}：¥${total}${yuan}`);
  }

  // 实收金额：填了才在合计下方加一行
  const receivedRaw = document.getElementById('receivedAmount').value.trim();
  if(receivedRaw !== ''){
    lines.push(`${isEn?'Amount Received':'实收金额'}：¥${receivedRaw}${yuan}`);
  }

  document.getElementById('bill_output').innerText = lines.join('\n');
  document.getElementById('billAmount').value = lastTotal || '';
  // 实收框为空才自动填合计，已有值保留
  if(!document.getElementById('receivedAmount').value.trim()){
    document.getElementById('receivedAmount').value = lastTotal || '';
  }
  document.getElementById('copyBtn').style.display = 'block';
  document.getElementById('saveBtn').style.display = 'block';
}
/* ===== 一键复制到系统剪贴板（iPhone Safari 可靠方案） ===== */
function copyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) return true;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
  }
  return false;
}
function copyBill() {
  const text = document.getElementById('bill_output').innerText;
  if (!text) { toast('请先生成账单'); return; }
  if (copyText(text)) toast('✅ 已复制，去微信粘贴即可');
  else toast('复制失败，请长按账单文本手动复制');
}
/* ===== 保存到记账本（写入服务器 SQLite 数据库） ===== */
/* 从结果文本中解析总金额：支持「总计：X元」「费用合计：X元」，取最后一个 */
function parseAmountFromText(text) {
  const re = /(?:总计|费用合计)[：:]\s*([\d.]+)\s*元/g;
  let last = null;
  let m;
  while ((m = re.exec(text)) !== null) { last = m[1]; }
  return last;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
async function saveOrder() {
  const text = document.getElementById('bill_output').innerText;
  if (!text) { toast('请先生成账单'); return; }
  const firmIdx = document.getElementById("firmSelect").value;
  if (firmIdx === "") { toast('请先选择合作公司'); return; }
  const company = firmData[firmIdx].name;
  const date = document.getElementById("time").value;
  const contact = document.getElementById("contact").value.trim();
  // 总金额：优先从结果文本解析（手动改过的账单也准确），解析不到用输入框值
  const parsed = parseAmountFromText(text);
  const amount = parsed !== null ? parsed : document.getElementById("billAmount").value.trim();
  const received = document.getElementById("receivedAmount").value.trim() || amount;
  try {
    const res = await fetch('/api/order/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company, date, amount, received, contact, content: text })
    });
    const data = await res.json();
    if (data.ok) {
      toast('✅ 已保存到记账本');
      const btn = document.getElementById('saveBtn');
      btn.textContent = '✅ 已保存（可继续生成下一单）';
      setTimeout(() => { btn.textContent = '📌 保存到记账本'; }, 3000);
    } else {
      toast('保存失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    toast('保存失败，请确认服务已启动');
  }
}
window.onload = renderAllHistory;
</script>
