<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>用车账单生成器</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  padding: 12px;
  background: #F7FAFB;
  font-size: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  color: #111827;
}
.container {
  max-width: 480px;
  margin: 0 auto;
}
h1 {
  font-size: 24px;
  font-weight: 600;
  text-align: center;
  margin: 12px 0 16px;
}
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  padding: 14px 10px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  background: #E9EEF2;
  color: #444;
  cursor: pointer;
}
.tab-btn.active {
  background: #007AFF;
  color: #fff;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.btn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  margin: 8px 0;
  background: #007AFF;
  color: #fff;
}
.copy-btn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 500;
  margin: 8px 0;
  background: #34C759;
  color: #fff;
}
.btn-green {
  width: 100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:500;
  margin:8px 0;
  background:#28c76f;
  color:#fff;
}
label {
  font-weight: 600;
  margin-top: 10px;
  margin-bottom: 6px;
  display:block;
}
input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  font-size: 16px;
  background: #fff;
  margin-bottom: 10px;
}
.bill {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.6;
}
.hide {display:none;}
.history-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
  margin-bottom: 10px;
}
.pill-btn {
  padding: 6px 10px;
  background: #f1f5f9;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  color: #333;
  cursor: pointer;
}

/*弹窗*/
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:999;
  display:none;
  padding:16px;
}
.modal-wrap{
  background:#fff;
  border-radius:16px;
  max-width:480px;
  margin:0 auto;
  max-height:85vh;
  overflow-y:auto;
  padding:18px;
}
.modal-text{
  white-space:pre-wrap;
  background:#f7f9fa;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  line-height:1.6;
  margin:10px 0;
}
/* 轻提示 */
#toast{
  position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
  background:rgba(17,24,39,0.92);color:#fff;padding:10px 18px;border-radius:10px;
  font-size:14px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div class="container">
  <h1>用车账单生成器</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('transfer')">接送机</button>
    <button class="tab-btn" onclick="switchTab('package')">包车</button>
    <button class="tab-btn" onclick="switchTab('point')">点对点</button>
  </div>
  <div class="card">
    <label>选择合作公司</label>
    <select id="firmSelect">
      <option value="">请选择公司</option>
      <!--__FIRM_OPTIONS__-->
    </select>

    <label>报价模板语言</label>
    <select id="quoteLang">
        <option value="zh">中文</option>
        <option value="en">English 英文</option>
    </select>
    <button class="btn-green" onclick="generateQuote()">📄生成【当前标签页】报价</button>

    <label>@对接人</label>
    <input id="contact" placeholder="输入名字，自动带 @">
    <div class="history-pills" id="hist_contact"></div>
    <label>客户</label>
    <input id="customer">
    <div class="history-pills" id="hist_customer"></div>
    <label>服务日期</label>
    <input id="time" type="date">

    <div id="transfer_panel" class="tab-panel">
      <label>接送类型</label>
      <select id="transferKind">
        <option value="airport">机场接送</option>
        <option value="station">高铁站接送</option>
      </select>
      <label>航班</label>
      <input id="flight">
      <div class="history-pills" id="hist_flight"></div>
      <label>举牌服务</label>
      <select id="sign">
        <option value="0">不需要</option>
        <option value="1">需要</option>
      </select>
      <label>深夜时段(23:00‑05:00)</label>
      <select id="night">
        <option value="0">否</option>
        <option value="1">是</option>
      </select>
    </div>

    <div id="package_panel" class="tab-panel hide">
      <label>开始时间</label>
      <input id="startHour" type="time">
      <label>结束时间</label>
      <input id="endHour" type="time">
      <label>行驶里程(km)</label>
      <input id="km" value="50">
      <label>套餐选择</label>
      <select id="packageType">
        <option value="4">4小时/50公里</option>
        <option value="8">8小时/100公里</option>
      </select>
    </div>

    <div id="point_panel" class="tab-panel hide">
      <label>行驶里程(km)</label>
      <input id="point_km" value="0">
    </div>

    <label>车型</label>
    <select id="car">
      <option value="normal">舒适车型 | Comfort</option>
      <option value="van">六座豪华商务车 | Business</option>
    </select>
    <label>行程路线</label>
    <input id="route" placeholder="输入地址用空格分隔，自动转箭头">
    <div class="history-pills" id="hist_route"></div>
    <label>路桥停车费（实报实销）</label>
    <input id="park" value="0">
    <button class="btn" onclick="generate()">生成单次用车账单</button>
  </div>
  <div class="card">
    <h3>账单文本（可复制）</h3>
    <div id="bill_output" class="bill"></div>
    <div style="margin-top:12px;">
      <label style="display:block;font-size:13px;color:#666;margin-bottom:4px;">账单总金额（元）— 保存时自动从账单文本识别，可手动改</label>
      <input type="number" id="billAmount" step="0.01" min="0" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px;" placeholder="自动从账单文本识别">
      <label style="display:block;font-size:13px;color:#666;margin-bottom:4px;">实收金额（元）— 实际收到的钱，默认等于总金额，可改</label>
      <input type="number" id="receivedAmount" step="0.01" min="0" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;" placeholder="默认等于总金额">
    </div>
    <button class="copy-btn" onclick="copyBill()" id="copyBtn" style="display:none;">✅ 一键复制账单</button>
    <button class="copy-btn" onclick="saveOrder()" id="saveBtn" style="display:none;background:#FF9500;">📌 保存到记账本</button>
  </div>
  <div style="text-align:center;margin-top:10px">
     <a href="/admin">进入后台管理</a>
  </div>
</div>

<!--报价弹窗-->
<div class="modal-mask" id="quoteModal">
    <div class="modal-wrap">
        <h3>对外报价模板</h3>
        <div class="modal-text" id="quoteText"></div>
        <button class="copy-btn" onclick="copyQuote()">复制报价文本</button>
        <button class="btn" onclick="closeQuoteModal()">关闭</button>
    </div>
</div>

<div id="toast"></div>

<script>
const firmData = __FIRMS_JSON__;
let currentType = 'transfer';

function switchTab(type) {
  currentType = type;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.remove('active');
    if ((type === 'transfer' && i === 0) ||
        (type === 'package' && i === 1) ||
        (type === 'point' && i === 2)) btn.classList.add('active');
  });
  document.getElementById('transfer_panel').classList.toggle('hide', type !== 'transfer');
  document.getElementById('package_panel').classList.toggle('hide', type !== 'package');
  document.getElementById('point_panel').classList.toggle('hide', type !== 'point');
}
/* ===== 历史记录（存服务器数据库 SQLite，每类最多 10 条；换设备/清缓存不丢） ===== */
function saveHistory(key, value) {
  if (!value) return;
  fetch('/api/history/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: key, value: value })
  }).then(r => r.json()).then(d => { if (d.ok) renderAllHistory(); }).catch(() => {});
}
function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderHistory(key, targetId, list) {
  let el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = (list || []).map(v =>
    `<button class="pill-btn" data-h="${key}" data-v="${escHtml(v)}">${escHtml(v)}</button>`
  ).join('');
}
function renderAllHistory() {
  fetch('/api/history/list').then(r => r.json()).then(d => {
    if (!d.ok) return;
    const h = d.history || {};
    renderHistory('contact', 'hist_contact', h.contact);
    renderHistory('customer', 'hist_customer', h.customer);
    renderHistory('flight', 'hist_flight', h.flight);
    renderHistory('route', 'hist_route', h.route);
  }).catch(() => {});
}
/* 历史记录按钮点击 → 填入对应输入框（事件委托，避免引号注入） */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.pill-btn');
  if (!btn) return;
  const el = document.getElementById(btn.getAttribute('data-h'));
  if (el) el.value = btn.getAttribute('data-v');
});
function calcHour(start,end){
  if(!start||!end)return 0;
  let s=new Date(`2026-01-01 ${start}`);
  let e=new Date(`2026-01-01 ${end}`);
  let diff=(e-s)/1000/60/60;
  return diff<0?diff+24:diff;
}

// ==========生成当前tab对应的报价，价格读取选中公司后台配置==========
function generateQuote(){
    const idx = document.getElementById("firmSelect").value;
    const lang = document.getElementById("quoteLang").value;
    if(idx === ""){
        alert("请先选择合作公司");
        return;
    }
    const r = firmData[idx];
    let out = "";

    if(currentType === "transfer"){
        if(lang === "zh"){
            out = `【接送机报价】
一、机场/高铁站接或送
服务范围：佛山禅城/桂城 ↔ 广州白云机场/南站（往或返）
1. 舒适专车：机场¥${r.transfer.normal_airport}，高铁站¥${r.transfer.normal_station}
2. 六座豪华商务车：机场¥${r.transfer.van_airport}，高铁站¥${r.transfer.van_station}
附加服务：举牌接人¥${r.transfer.sign_fee}/次；深夜服务费（23:00‑05:00）¥${r.transfer.night_fee}/次
备注：单程包干价（含路桥/燃油），停车费实报`;
        }else{
            out = `【Transfer Quotation】
1. Airport/Railway Station Transfer
Service Area: Chancheng/Guicheng(Foshan) ↔ Guangzhou Baiyun Airport / South Railway Station
① Executive Car: Airport ¥${r.transfer.normal_airport}, Railway Station ¥${r.transfer.normal_station}
② 6‑Seater Premium MPV: Airport ¥${r.transfer.van_airport}, Railway Station ¥${r.transfer.van_station}
Additional Services: Meet & Greet: ¥${r.transfer.sign_fee}/per trip; Late‑night Surcharge(23:00‑05:00): ¥${r.transfer.night_fee}/per trip
Notes: One‑way all-inclusive(tolls/fuel); parking fees at actual cost`;
        }
    }else if(currentType === "package"){
        if(lang === "zh"){
            out = `【包车报价】
计费规则：套餐含固定时长/里程，超时/超里程额外计费
1. 舒适专车：¥${r.package.normal_4h}（4h/50km）、¥${r.package.normal_8h}（8h/100km）；超时¥${r.package.normal_over_h}/h，超里程¥${r.package.normal_over_km}/km
2. 六座商务车：¥${r.package.van_4h}（4h/50km）、¥${r.package.van_8h}（8h/100km）；超时¥${r.package.van_over_h}/h，超里程¥${r.package.van_over_km}/km
其他费用：路桥/停车费实报`;
        }else{
            out = `【Daily Charter Quotation】
1. Daily Charter Service
Billing: Package with allotted hrs/km; extra for overtime/additional mileage
① Executive Car: ¥${r.package.normal_4h}(4h/50km), ¥${r.package.normal_8h}(8h/100km); Overtime:¥${r.package.normal_over_h}/h, Extra mileage:¥${r.package.normal_over_km}/km
② 6‑Seater MPV: ¥${r.package.van_4h}(4h/50km), ¥${r.package.van_8h}(8h/100km); Overtime:¥${r.package.van_over_h}/h, Extra mileage:¥${r.package.van_over_km}/km
Other Fees: Tolls/parking at actual cost`;
        }
    }else if(currentType === "point"){
        if(lang === "zh"){
            out = `【点对点报价】
计费规则：按里程计费，设最低消费（取较高值）
1. 舒适专车：¥${r.point.normal_rate}/km，最低¥${r.point.normal_min}
2. 六座商务车：¥${r.point.van_rate}/km，最低¥${r.point.van_min}
计算：总费用=基础车费（里程费/最低消费取高）+ 实报路桥/停车费`;
        }else{
            out = `【Point‑to‑Point Quotation】
1. Point‑to‑Point (Distance‑Based)
Billing: Fare by distance; minimum fare applies(higher amount adopted)
① Executive Car:¥${r.point.normal_rate}/km, Min.¥${r.point.normal_min}
② 6‑Seater MPV:¥${r.point.van_rate}/km, Min.¥${r.point.van_min}
Calculation: Total=Base Fare + Actual Tolls/Parking`;
        }
    }

    document.getElementById("quoteText").innerText = out;
    document.getElementById("quoteModal").style.display = "block";
}
function closeQuoteModal(){
    document.getElementById("quoteModal").style.display="none";
}
async function copyQuote(){
    const txt = document.getElementById("quoteText").innerText;
    if(copyText(txt)){ toast("报价已复制"); }
    else{ alert("复制失败，请手动长按复制文本"); }
}

// ==========原有单次账单生成==========
function generate(){
  const firmIdx = document.getElementById("firmSelect").value;
  if(firmIdx===""){
    alert("请先选择合作公司");
    return;
  }
  const rate = firmData[firmIdx];

  let val=id=>document.getElementById(id).value.trim();
  let num=id=>Number(document.getElementById(id).value)||0;
  let contact = val('contact');
  let customer = val('customer');
  let date = val('time');
  let car = val('car');
  let flight = val('flight');
  let route = val('route').replace(/\s+/g, ' → ');
  let park = num('park');
  saveHistory('contact', contact);
  saveHistory('customer', customer);
  saveHistory('flight', flight);
  saveHistory('route', val('route'));

  let transferKind = val("transferKind");
  let startT = val('startHour');
  let endT = val('endHour');
  let km = num('km');
  let pkg = val('packageType');
  let totalHour = calcHour(startT,endT);
  let pointKm = num('point_km');
  let signSel = num('sign');
  let nightSel = num('night');

  let carName = car === 'normal' ? '舒适专车' : '六座豪华商务车';
  let fmtDate = '';
  if(date){
    const [y,m,d] = date.split('-');
    fmtDate = `${y}年${m}月${d}日`;
  }
  let lastTotal = 0;
  let lines=[];
  if(contact){
    const cleanContact = String(contact).replace(/^@+/, ''); // 去掉用户手动输入的开头@，统一只输出一个@
    lines.push(`@${cleanContact}`);
  }
  lines.push(`客户：${customer}`);

  if(currentType === 'transfer'){
    const tr = rate.transfer;
    let base;
    let transferTitle = transferKind==="airport" ? "机场" : "高铁站";
    if(car==='normal'){
      base = transferKind==="airport" ? tr.normal_airport : tr.normal_station;
    }else{
      base = transferKind==="airport" ? tr.van_airport : tr.van_station;
    }
    let signFee = signSel ? tr.sign_fee : 0;
    let nightFee = nightSel ? tr.night_fee : 0;

    if(flight) lines.push(`航班：${flight}`);
    lines.push(`时间：${fmtDate}`);
    lines.push(`类型：接送机（${transferTitle}）`);
    lines.push(`车型：${carName}`);
    lines.push(`路线：${route}`);
    lines.push(`费用明细：`);
    lines.push(`  · 基础车费：${base}元`);
    if(signFee>0) lines.push(`  · 举牌服务：${signFee}元`);
    if(nightFee>0) lines.push(`  · 深夜服务费：${nightFee}元`);
    let total = base + signFee + nightFee + park;
    lastTotal = total;
    lines.push(`  · 路桥停车：${park}元`);
    lines.push(`——————————————`);
    lines.push(`总计：${total}元`);
  }
  else if(currentType === 'package'){
    const pk = rate.package;
    let baseHour = Number(pkg);
    let baseKm = baseHour === 4 ? 50 : 100;
    let basePrice, hourPrice, kmPrice;
    if (car === 'normal') {
      basePrice = baseHour ===4 ? pk.normal_4h : pk.normal_8h;
      hourPrice = pk.normal_over_h;
      kmPrice = pk.normal_over_km;
    } else {
      basePrice = baseHour ===4 ? pk.van_4h : pk.van_8h;
      hourPrice = pk.van_over_h;
      kmPrice = pk.van_over_km;
    }
    let overHour = Math.max(0, totalHour - baseHour);
    let overKm = Math.max(0, km - baseKm);
    let overHourPrice = overHour * hourPrice;
    let overKmPrice = overKm * kmPrice;
    let sum = basePrice + overHourPrice + overKmPrice + park;
    lastTotal = sum;
    lines.push(`服务日期：${fmtDate}`);
    lines.push(`使用车型：[√]${carName}`);
    lines.push(`套餐选择：[√]${baseHour} 小时/${baseKm} 公里套餐`);
    lines.push(`用车时间：${startT} 至 ${endT}（共 ${totalHour.toFixed(1)} 小时）`);
    lines.push(`行驶里程：${km} 公里`);
    lines.push(`行程路线：${route}`);
    lines.push(`费用计算：`);
    lines.push(`· 套餐基础费：${basePrice}元`);
    lines.push(`· 超时费：${overHour.toFixed(1)} 小时 × ${hourPrice}元 = ${overHourPrice}元`);
    lines.push(`· 超里程费：${overKm} 公里 × ${kmPrice}元 = ${overKmPrice}元`);
    lines.push(`· 路桥停车费（实报实销）：${park}元`);
    lines.push(`——————————————`);
    lines.push(`费用合计：${sum}元`);
  }
  else {
    const pt = rate.point;
    let rateKm, minFee;
    if (car === 'normal') {
      rateKm = pt.normal_rate;
      minFee = pt.normal_min;
    } else {
      rateKm = pt.van_rate;
      minFee = pt.van_min;
    }
    let calcFee = pointKm * rateKm;
    let baseFee = Math.max(calcFee, minFee);
    lines.push(`时间：${fmtDate}`);
    lines.push(`类型：点对点`);
    lines.push(`车型：${carName}`);
    lines.push(`路线：${route}`);
    lines.push(`费用明细：`);
    lines.push(`  · 里程：${pointKm} km × ${rateKm} 元/km = ${calcFee.toFixed(1)}元`);
    lines.push(`  · 最低消费：${minFee}元`);
    lines.push(`  · 基础车费：${Math.round(baseFee)}元`);
    let total = Math.round(baseFee) + park;
    lastTotal = total;
    lines.push(`  · 路桥停车：${park}元`);
    lines.push(`——————————————`);
    lines.push(`总计：${total}元`);
  }
  document.getElementById('bill_output').innerText = lines.join('\n');
  document.getElementById('billAmount').value = lastTotal || '';
  document.getElementById('receivedAmount').value = lastTotal || '';
  document.getElementById('copyBtn').style.display = 'block';
  document.getElementById('saveBtn').style.display = 'block';
}
/* ===== 一键复制到系统剪贴板（iPhone Safari 可靠方案） ===== */
function copyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) return true;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
  }
  return false;
}
function copyBill() {
  const text = document.getElementById('bill_output').innerText;
  if (!text) { toast('请先生成账单'); return; }
  if (copyText(text)) toast('✅ 已复制，去微信粘贴即可');
  else toast('复制失败，请长按账单文本手动复制');
}
/* ===== 保存到记账本（写入服务器 SQLite 数据库） ===== */
/* 从结果文本中解析总金额：支持「总计：X元」「费用合计：X元」，取最后一个 */
function parseAmountFromText(text) {
  const re = /(?:总计|费用合计)[：:]\s*([\d.]+)\s*元/g;
  let last = null;
  let m;
  while ((m = re.exec(text)) !== null) { last = m[1]; }
  return last;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
async function saveOrder() {
  const text = document.getElementById('bill_output').innerText;
  if (!text) { toast('请先生成账单'); return; }
  const firmIdx = document.getElementById("firmSelect").value;
  if (firmIdx === "") { toast('请先选择合作公司'); return; }
  const company = firmData[firmIdx].name;
  const date = document.getElementById("time").value;
  const contact = document.getElementById("contact").value.trim();
  // 总金额：优先从结果文本解析（手动改过的账单也准确），解析不到用输入框值
  const parsed = parseAmountFromText(text);
  const amount = parsed !== null ? parsed : document.getElementById("billAmount").value.trim();
  const received = document.getElementById("receivedAmount").value.trim() || amount;
  try {
    const res = await fetch('/api/order/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company, date, amount, received, contact, content: text })
    });
    const data = await res.json();
    if (data.ok) {
      toast('✅ 已保存到记账本');
      const btn = document.getElementById('saveBtn');
      btn.textContent = '✅ 已保存（可继续生成下一单）';
      setTimeout(() => { btn.textContent = '📌 保存到记账本'; }, 3000);
    } else {
      toast('保存失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    toast('保存失败，请确认服务已启动');
  }
}
window.onload = renderAllHistory;
